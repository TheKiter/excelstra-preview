[build]
  publish = "v4"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Aggressive immutable caching for the 239 video canvas frames
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/frames-sm/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Standard asset caching
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
