<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excelstra — Version Comparison Suite (Susie Draft vs Latest Production)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070c10;
      --bg-surface: #0e171b;
      --bg-surface-elevated: #142127;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(191, 155, 48, 0.3);
      --text-main: #f0f4f5;
      --text-muted: #8ea1a9;
      --gold: #bf9b30;
      --gold-light: #dabe81;
      --amber: #d97706;
      --green: #10b981;
      --header-h: 62px;
      --pane-header-h: 40px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Suite Header */
    header.suite-nav {
      height: var(--header-h);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 16px;
      z-index: 100;
      position: relative;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand-mark {
      font-family: 'Lora', serif;
      font-weight: 500;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(191, 155, 48, 0.6);
    }

    .badge-mode {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(191, 155, 48, 0.12);
      border: 1px solid var(--border-accent);
      color: var(--gold-light);
      font-weight: 600;
    }

    /* Controls Bar */
    .controls-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .control-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0 6px;
      font-weight: 600;
    }

    select.page-select {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select.page-select:focus {
      border-color: var(--gold);
    }

    .btn-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-toggle:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-toggle.active {
      background: var(--bg-surface-elevated);
      color: var(--gold-light);
      border: 1px solid var(--border-accent);
    }

    .sync-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .sync-toggle-btn.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Main Workspace Container */
    main.comparison-workspace {
      display: flex;
      width: 100vw;
      height: calc(100vh - var(--header-h));
      position: relative;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* Pane Column */
    .comparison-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
      min-width: 0;
      position: relative;
      transition: flex 0.25s ease, width 0.25s ease;
    }

    .comparison-pane.hidden {
      display: none !important;
    }

    .comparison-pane + .comparison-pane {
      border-left: 1px solid var(--border-subtle);
    }

    /* Pane Sub-Header */
    .pane-header {
      height: var(--pane-header-h);
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 0.78rem;
    }

    .pane-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pane-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .tag-v3 {
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(217, 119, 6, 0.35);
      color: #fbbf24;
    }

    .tag-v4 {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .pane-filename {
      color: var(--text-muted);
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.72rem;
    }

    .pane-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pane-action {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-pane-action:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: var(--border-accent);
    }

    /* Frame Wrapper */
    .frame-viewport {
      flex: 1;
      width: 100%;
      height: calc(100% - var(--pane-header-h));
      position: relative;
      background: #ffffff;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .frame-viewport.device-tablet {
      background: #05080a;
      padding: 12px 0;
    }

    .frame-viewport.device-tablet iframe {
      width: 768px !important;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
    }

    .frame-viewport.device-mobile {
      background: #05080a;
      padding: 12px 0;
    }

    .frame-viewport.device-mobile iframe {
      width: 390px !important;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
    }

    iframe.content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* Scroll Synchronization Floating Indicator */
    .sync-toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 23, 27, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-accent);
      color: var(--gold-light);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .sync-toast.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Main Suite Navbar -->
  <header class="suite-nav">
    <div class="brand-cluster">
      <div class="brand-mark">
        <span class="dot"></span>
        <span>Excelstra</span>
      </div>
      <span class="badge-mode">Side-by-Side Review</span>
    </div>

    <div class="controls-cluster">
      <!-- Page Navigation Dropdown -->
      <div class="control-group">
        <span class="control-label">Page</span>
        <select id="pageSelect" class="page-select">
          <option value="index.html">Homepage (index.html)</option>
          <option value="the-architecture.html">The Architecture (10 Levels)</option>
          <option value="about-eunicia.html">About Eunicia Peret</option>
          <option value="mastermind.html">Mastermind Summit</option>
          <option value="member-stories.html">Member Stories</option>
          <option value="our-team.html">Our Team & Bench</option>
          <option value="wealth-calculator.html">Wealth Calculator</option>
          <option value="wealth-assessment.html">Wealth Assessment</option>
          <option value="questions-to-ask.html">Questions to Ask</option>
          <option value="membership.html">Membership Structure</option>
          <option value="events.html">Events & Summits</option>
          <option value="speaking.html">Keynote & Speaking</option>
          <option value="newsletter.html">Private Newsletter</option>
          <option value="podcast.html">Podcast Series</option>
          <option value="book-a-call.html">Book a Consultation</option>
          <option value="faq.html">Frequently Asked Questions</option>
        </select>
      </div>

      <!-- View Layout Modes -->
      <div class="control-group">
        <span class="control-label">View</span>
        <button class="btn-toggle active" data-view="split" id="btnViewSplit">Split 50/50</button>
        <button class="btn-toggle" data-view="v3" id="btnViewV3">Susie Only</button>
        <button class="btn-toggle" data-view="v4" id="btnViewV4">Latest Only</button>
      </div>

      <!-- Device Viewport Emulation -->
      <div class="control-group">
        <span class="control-label">Device</span>
        <button class="btn-toggle active" data-device="fluid">Full</button>
        <button class="btn-toggle" data-device="tablet">Tablet</button>
        <button class="btn-toggle" data-device="mobile">Mobile</button>
      </div>

      <!-- Sync Scrolling Toggle -->
      <button class="sync-toggle-btn active" id="btnSyncScroll" title="Toggle Synchronized Scrolling">
        <span class="sync-dot"></span>
        <span>Sync Scroll</span>
      </button>
    </div>
  </header>

  <!-- Side-by-Side Comparison Workspace -->
  <main class="comparison-workspace" id="workspace">

    <!-- Left: Susie Draft (Version 3) -->
    <section class="comparison-pane" id="paneV3">
      <div class="pane-header">
        <div class="pane-title-group">
          <span class="pane-tag tag-v3">Susie Draft (v3 Baseline)</span>
          <span class="pane-filename" id="labelV3Path">v3/index.html</span>
        </div>
        <div class="pane-actions">
          <a href="v3/index.html" target="_blank" class="btn-pane-action" id="linkStandaloneV3" title="Open Susie Version in New Tab">
            <span>Open Standalone</span>
            <span>↗</span>
          </a>
        </div>
      </div>
      <div class="frame-viewport" id="viewportV3">
        <iframe src="v3/index.html" class="content-frame" id="frameV3" title="Excelstra Susie Draft (v3)"></iframe>
      </div>
    </section>

    <!-- Right: Latest Production (Version 4) -->
    <section class="comparison-pane" id="paneV4">
      <div class="pane-header">
        <div class="pane-title-group">
          <span class="pane-tag tag-v4">Latest Version (v4 Sovereign)</span>
          <span class="pane-filename" id="labelV4Path">v4/index.html</span>
        </div>
        <div class="pane-actions">
          <a href="v4/index.html" target="_blank" class="btn-pane-action" id="linkStandaloneV4" title="Open Latest Version in New Tab">
            <span>Open Standalone</span>
            <span>↗</span>
          </a>
        </div>
      </div>
      <div class="frame-viewport" id="viewportV4">
        <iframe src="v4/index.html" class="content-frame" id="frameV4" title="Excelstra Latest Version (v4)"></iframe>
      </div>
    </section>

  </main>

  <div class="sync-toast" id="syncToast">Synchronized Scrolling Active</div>

  <script>
    (function () {
      'use strict';

      const pageSelect = document.getElementById('pageSelect');
      const frameV3 = document.getElementById('frameV3');
      const frameV4 = document.getElementById('frameV4');
      const labelV3Path = document.getElementById('labelV3Path');
      const labelV4Path = document.getElementById('labelV4Path');
      const linkStandaloneV3 = document.getElementById('linkStandaloneV3');
      const linkStandaloneV4 = document.getElementById('linkStandaloneV4');

      const paneV3 = document.getElementById('paneV3');
      const paneV4 = document.getElementById('paneV4');
      const viewportV3 = document.getElementById('viewportV3');
      const viewportV4 = document.getElementById('viewportV4');

      const btnViewSplit = document.getElementById('btnViewSplit');
      const btnViewV3 = document.getElementById('btnViewV3');
      const btnViewV4 = document.getElementById('btnViewV4');
      const viewButtons = [btnViewSplit, btnViewV3, btnViewV4];

      const btnSyncScroll = document.getElementById('btnSyncScroll');
      const syncToast = document.getElementById('syncToast');

      let isSyncScrolling = true;
      let activeScrollSource = null;
      let scrollTimeout = null;

      // ── Synchronized Page Navigation ──
      function loadPage(pageFile) {
        const v3Url = 'v3/' + pageFile;
        const v4Url = 'v4/' + pageFile;

        frameV3.src = v3Url;
        frameV4.src = v4Url;

        labelV3Path.textContent = v3Url;
        labelV4Path.textContent = v4Url;

        linkStandaloneV3.href = v3Url;
        linkStandaloneV4.href = v4Url;
      }

      pageSelect.addEventListener('change', function () {
        loadPage(this.value);
      });

      // ── View Mode Toggles ──
      viewButtons.forEach(btn => {
        btn.addEventListener('click', function () {
          viewButtons.forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          const mode = this.getAttribute('data-view');
          if (mode === 'split') {
            paneV3.classList.remove('hidden');
            paneV4.classList.remove('hidden');
          } else if (mode === 'v3') {
            paneV3.classList.remove('hidden');
            paneV4.classList.add('hidden');
          } else if (mode === 'v4') {
            paneV3.classList.add('hidden');
            paneV4.classList.remove('hidden');
          }
        });
      });

      // ── Device Viewport Emulation ──
      const deviceButtons = document.querySelectorAll('[data-device]');
      deviceButtons.forEach(btn => {
        btn.addEventListener('click', function () {
          deviceButtons.forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          const device = this.getAttribute('data-device');
          viewportV3.className = 'frame-viewport' + (device !== 'fluid' ? ' device-' + device : '');
          viewportV4.className = 'frame-viewport' + (device !== 'fluid' ? ' device-' + device : '');
        });
      });

      // ── Synchronized Scrolling (Same-Origin Native) ──
      btnSyncScroll.addEventListener('click', function () {
        isSyncScrolling = !isSyncScrolling;
        this.classList.toggle('active', isSyncScrolling);
        showSyncToast(isSyncScrolling ? 'Synchronized Scrolling Enabled' : 'Independent Scrolling Enabled');
      });

      function showSyncToast(text) {
        syncToast.textContent = text;
        syncToast.classList.add('visible');
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          syncToast.classList.remove('visible');
        }, 1800);
      }

      function setupFrameScrollSync(sourceFrame, targetFrame, sourceName) {
        sourceFrame.addEventListener('load', function () {
          try {
            const win = sourceFrame.contentWindow;
            if (!win) return;

            win.addEventListener('scroll', function () {
              if (!isSyncScrolling) return;
              if (activeScrollSource && activeScrollSource !== sourceName) return;

              activeScrollSource = sourceName;
              const sourceDoc = win.document.documentElement || win.document.body;
              const maxSourceScroll = sourceDoc.scrollHeight - win.innerHeight;
              const scrollRatio = maxSourceScroll > 0 ? win.scrollY / maxSourceScroll : 0;

              try {
                const targetWin = targetFrame.contentWindow;
                if (targetWin) {
                  const targetDoc = targetWin.document.documentElement || targetWin.document.body;
                  const maxTargetScroll = targetDoc.scrollHeight - targetWin.innerHeight;
                  targetWin.scrollTo({
                    top: scrollRatio * maxTargetScroll,
                    behavior: 'auto'
                  });
                }
              } catch (e) {}

              clearTimeout(scrollTimeout);
              scrollTimeout = setTimeout(() => {
                activeScrollSource = null;
              }, 60);
            }, { passive: true });

          } catch (err) {
            console.warn('Same-origin frame sync note:', err);
          }
        });
      }

      setupFrameScrollSync(frameV3, frameV4, 'v3');
      setupFrameScrollSync(frameV4, frameV3, 'v4');

    })();
  </script>
</body>
</html>
